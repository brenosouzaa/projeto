<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>NFC Point</title><style>
:root{--bg:#090b10;--p:#121722;--p2:#191f2b;--line:#293142;--txt:#f8fafc;--mut:#9ca3af;--pri:#7c3aed;--ok:#16a34a;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202636}.brand{font-weight:900;display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--pri),#111827);display:grid;place-items:center}.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.pri{background:var(--pri);border-color:transparent}.btn.danger{background:#2a1114;color:#fecaca;border-color:#5c2027}.btn.sm{padding:8px 10px;font-size:12px}.hero{padding:72px 0}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.98;letter-spacing:-.055em;margin:0 0 22px}.hero h1 span{color:#a78bfa}.hero p{max-width:650px;color:#b7bfcd;font-size:18px;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap}.section{padding:55px 0;border-top:1px solid #171c27}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:20px}.card h3{margin:0 0 8px}.mut{color:var(--mut)}.price{font-size:38px;font-weight:900}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(430px,100%);background:var(--p);border:1px solid var(--line);border-radius:22px;padding:24px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#b9c0cc;font-weight:700}.input,.textarea{width:100%;background:#0c1018;border:1px solid var(--line);border-radius:11px;padding:12px;color:#fff;outline:none}.textarea{min-height:80px}.tabs{display:gr px 18px #0f172a0d}.pi{width:40px;height:40px;border-radius:12px;color:#fff;display:grid;place-items:center}.info{margin-top:12px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;color:#374151}.foot{text-align:center;color:#9ca3af;font-size:11px;margin-top:22px}.toast{position:fixed;right:16px;bottom:16px;background:#202633;border:1px solid #394256;border-radius:12px;padding:12px 14px;z-index:50;max-width:330px}.err{color:#fecaca}.empty{text-align:center;color:#9ca3af;padding:30px}.qr{text-align:center}.qr img{width:220px;height:220px;background:#fff;padding:8px;border-radius:12px}.small{font-size:12px}.break{word-break:break-all}@media(max-width:720px){.grid3,.stats,.formgrid{grid-template-columns:1fr 1fr}.stats .stat b{font-size:22px}.hero{padding:52px 0}.store{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid3,.stats,.formgrid{grid-template-columns:1fr}.hero h1{font-size:46px}.top .btn{display:none}}
</style></head><body><div id="app"></div><script>
const URL='https://gvgzjkjdknvnffwjzjqh.supabase.co',KEY='sb_publishable_6Ds9E5zKqpoBOyfzCiDw5Q_8cyYXaYY',FN='/functions/v1/nfc-point-app',app=document.getElementById('app');
const S=()=>{try{return JSON.parse(localStorage.nfcsession||'null')}catch{return null}},SS=s=>s?localStorage.nfcsession=JSON.stringify(s):localStorage.removeItem('nfcsession');
const esc=(s='')=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,60),safe=u=>{try{let x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch{return''}},base=location.pathname.includes(FN)?FN:'',path=()=>{let q=new URLSearchParams(location.search);if(q.get('loja'))return'/loja/'+q.get('loja');if(q.get('view')==='admin')return'/admin';return'/'},go=p=>{let u=base||location.pathname;if(p==='/admin')u+='?view=admin';else if(p.startsWith('/loja/'))u+='?loja='+encodeURIComponent(p.slice(6));history.pushState({},'',u);route()},pub=s=>location.origin+(base||location.pathname)+'?loja='+encodeURIComponent(s);
function toast(t,e=0){let x=document.createElement('div');x.className='toast'+(e?' err':'');x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2600)}
addEventListener('popstate',route);document.addEventListener('click',e=>{let a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
async function req(p,o={}){let s=S(),h={apikey:KEY,'Content-Type':'application/json'};if(o.auth!==false&&s?.access_token)h.Authorization='Bearer '+s.access_token;if(o.prefer)h.Prefer=o.prefer;let r=await fetch(URL+'/rest/v1/'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}),t=await r.text(),d=t?JSON.parse(t):null;if(r.status===401&&s?.refresh_token&&!o.retry){let ok=await refresh();if(ok)return req(p,{...o,retry:true})}if(!r.ok)throw Error(d?.message||d?.error_description||'Erro '+r.status);return d}
async function refresh(){let s=S();if(!s?.refresh_token)return false;let r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok){SS(null);return false}SS(await r.json());return true}
async function login(email,password){let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Falha ao entrar');SS(d)}
async function signup(email,password){let r=await fetch(URL+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Falha ao criar conta');if(d.access_token)SS(d);return d}
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
async function stores(){let u=S()?.user?.id;if(!u)return[];return req('stores?owner_id=eq.'+encodeURIComponent(u)+'&select=*&order=created_at.desc')}
async function events(){return req('events?select=store_id,event_type,target,created_at&created_at=gte.'+encodeURIComponent(new Date(Date.now()-30*864e5).toISOString()))}
async function storeBySlug(s){let d=await req('stores?slug=eq.'+encodeURIComponent(s)+'&is_active=eq.true&select=*&limit=1',{auth:false});return d?.[0]}
async function track(id,type,target=''){try{await req('events',{method:'POST',body:{store_id:id,event_type:type,target},auth:false,prefer:'return=minimal'})}catch{}}
function landing(){app.innerHTML=`<div class="wrap top"><div class="brand"><div class="logo">N</div>NFC Point</div><button class="btn pri" onclick="go('/admin')">Painel</button></div><main><section class="wrap hero"><h1>Sua empresa inteira<br><span>em um toque.</span></h1><p>NFC + QR Code + página digital personalizada para estabelecimentos. WhatsApp, Instagram, localização, catálogo, horários e métricas em um só lugar.</p><div class="row"><a class="btn pri" href="/loja/demo" data-go>Ver demonstração</a><a class="btn" href="/admin" data-go>Acessar painel</a></div></section><section class="section"><div class="wrap grid3"><div class="card"><h3>2 displays</h3><div class="mut">Duas placas apontando para a mesma página digital.</div></div><div class="card"><h3>Link permanente</h3><div class="mut">Mude dados da loja sem regravar o NFC.</div></div><div class="card"><h3>Métricas</h3><div class="mut">Acompanhe visualizações, NFC, QR e cliques.</div></div></div></section><section class="section"><div class="wrap card"><div class="mut">Instalação</div><div class="price">R$ 129,90</div><p class="mut">+ R$ 29,90/mês por estabelecimento ativo.</p></div></section></main>`}
function auth(){if(S()?.access_token)return dash();app.innerHTML=`<div class="auth"><div class="authbox"><div class="brand"><div class="logo">N</div>NFC Point</div><h1>Painel</h1><p class="mut">Gerencie seus estabelecimentos e links NFC.</p><div class="tabs"><button id="tin" class="on">Entrar</button><button id="tup">Criar acesso</button></div><form id="af"><div class="field"><label>E-mail</label><input class="input" id="em" type="email" required></div><div class="field"><label>Senha</label><input class="input" id="pw" type="password" minlength="6" required></div><button class="btn pri" style="width:100%" id="ab">Entrar</button></form><button class="btn" style="width:100%;margin-top:10px" onclick="go('/')">Voltar</button></div></div>`;let mode='in',tin=document.getElementById('tin'),tup=document.getElementById('tup'),b=document.getElementById('ab');tin.onclick=()=>{mode='in';tin.className='on';tup.className='';b.textContent='Entrar'};tup.onclick=()=>{mode='up';tup.className='on';tin.className='';b.textContent='Criar acesso'};document.getElementById('af').onsubmit=async e=>{e.preventDefault();b.disabled=true;try{let email=document.getElementById('em').value,password=document.getElementById('pw').value;if(mode==='in')await login(email,password);else{let d=await signup(email,password);if(!d.access_token){toast('Conta criada. Confirme seu e-mail e depois entre.');b.disabled=false;return}}route()}catch(x){toast(x.message,1);b.disabled=false}}}
async function dash(){app.innerHTML='<div class="auth"><div class="mut">Carregando painel…</div></div>';try{let [ss,ev]=await Promise.all([stores(),events()]),ids=new Set(ss.map(x=>x.id)),own=ev.filter(x=>ids.has(x.store_id)),views=own.filter(x=>['page_view','nfc_open','qr_open'].includes(x.event_type)).length,clicks=own.filter(x=>x.event_type==='link_click').length,active=ss.filter(x=>x.is_active).length;app.innerHTML=`<div class="wrap top"><div class="brand"><div class="logo">N</div>NFC Point</div><div class="row"><button class="btn sm" id="out">Sair</button></div></div><main class="wrap admin"><div class="head"><div><h1>Estabelecimentos</h1><div class="mut small">${esc(S()?.user?.email||'')}</div></div><button class="btn pri" id="new">+ Novo</button></div><div class="stats"><div class="stat"><span class="mut small">Ativos</span><b>${active}</b></div><div class="stat"><span class="mut small">Visualizações 30d</span><b>${views}</b></div><div class="stat"><span class="mut small">Cliques 30d</span><b>${clicks}</b></div><div class="stat"><span class="mut small">MRR</span><b>R$ ${(active*29.9).toFixed(2).replace('.',',')}</b></div></div><div class="list">${ss.length?ss.map(s=>`<div class="store"><div><h3>${esc(s.name)} <span class="badge ${s.is_active?'':'off'}">${s.is_active?'ATIVO':'PAUSADO'}</span></h3><div class="mut small break">${esc(pub(s.slug))}</div></div><div class="row"><button class="btn sm" data-open="${s.id}">Editar</button><button class="btn sm" data-qr="${s.id}">Link/QR</button><a class="btn sm" target="_blank" href="${esc(pub(s.slug))}">Abrir</a></div></div>`).join(''):'<div class="empty">Nenhum estabelecimento ainda.</div>'}</div></main>`;document.getElementById('out').onclick=()=>{SS(null);go('/admin')};document.getElementById('new').onclick=()=>modal();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>modal(ss.find(s=>s.id===b.dataset.open)));document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>qr(ss.find(s=>s.id===b.dataset.qr)))}catch(e){toast(e.message,1);if(/JWT|401|login/i.test(e.message)){SS(null);auth()}}}
function modal(s=null){let x=s||{name:'',category:'Estabelecimento',slug:'',description:'',logo_url:'',accent_color:'#7c3aed',whatsapp:'',instagram:'',maps_url:'',catalog_url:'',website_url:'',phone:'',address:'',hours:'',is_active:true},m=document.createElement('div');m.className='modalbg';m.innerHTML=`<div class="modal"><h2>${s?'Editar':'Novo'} estabelecimento</h2><form id="sf"><div class="formgrid"><div class="field"><label>Nome *</label><input class="input" id="n" value="${esc(x.name)}" required></div><div class="field"><label>Slug *</label><input class="input" id="sl" value="${esc(x.slug)}" required></div><div class="field"><label>Categoria</label><input class="input" id="cat" value="${esc(x.category)}"></div><div class="field"><label>Cor</label><input class="input" id="co" type="color" value="${esc(x.accent_color||'#7c3aed')}"></div></div><div class="field"><label>Descrição</label><textarea class="textarea" id="de">${esc(x.description)}</textarea></div><div class="formgrid"><div class="field"><label>WhatsApp</label><input class="input" id="wa" value="${esc(x.whatsapp)}"></div><div class="field"><label>Instagram</label><input class="input" id="ig" value="${esc(x.instagram)}"></div><div class="field"><label>Endereço</label><input class="input" id="ad" value="${esc(x.address)}"></div><div class="field"><label>Horário</label><input class="input" id="hr" value="${esc(x.hours)}"></div><div class="field"><label>Google Maps URL</label><input class="input" id="mp" value="${esc(x.maps_url)}"></div><div class="field"><label>Catálogo URL</label><input class="input" id="ca" value="${esc(x.catalog_url)}"></div><div class="field"><label>Site URL</label><input class="input" id="web" value="${esc(x.website_url)}"></div><div class="field"><label>Logo URL</label><input class="input" id="lo" value="${esc(x.logo_url||'')}"></div></div><label><input type="checkbox" id="act" ${x.is_active?'checked':''}> Página ativa</label><div class="modalfoot">${s?'<button type="button" class="btn danger" id="del">Excluir</button>':''}<button type="button" class="btn" id="cancel">Cancelar</button><button class="btn pri" id="save">Salvar</button></div></form></div>`;document.body.append(m);const q=id=>m.querySelector('#'+id),n=q('n'),sl=q('sl'),cat=q('cat'),co=q('co'),de=q('de'),wa=q('wa'),ig=q('ig'),ad=q('ad'),hr=q('hr'),mp=q('mp'),ca=q('ca'),web=q('web'),lo=q('lo'),act=q('act'),sf=q('sf');q('cancel').onclick=()=>m.remove();let touched=!!s;n.oninput=()=>{if(!touched)sl.value=slug(n.value)};sl.oninput=()=>{touched=true;sl.value=slug(sl.value)};sf.onsubmit=async e=>{e.preventDefault();let payload={name:n.value.trim(),slug:slug(sl.value),category:cat.value.trim()||'Estabelecimento',accent_color:co.value,description:de.value.trim(),whatsapp:wa.value.trim(),instagram:ig.value.trim(),address:ad.value.trim(),hours:hr.value.trim(),maps_url:safe(mp.value.trim()),catalog_url:safe(ca.value.trim()),website_url:safe(web.value.trim()),logo_url:safe(lo.value.trim()),is_active:act.checked};try{if(s)await req('stores?id=eq.'+s.id,{method:'PATCH',body:payload,prefer:'return=representation'});else await req('stores',{method:'POST',body:{...payload,owner_id:S().user.id},prefer:'return=representation'});toast('Salvo.');m.remove();dash()}catch(e){toast(e.message,1)}};if(s)q('del').onclick=async()=>{if(confirm('Excluir este estabelecimento?')){try{await req('stores?id=eq.'+s.id,{method:'DELETE'});m.remove();dash()}catch(e){toast(e.message,1)}}}}
function qr(s){let u=pub(s.slug),img='https://api.qrserver.com/v1/create-qr-code/?size=420x420&data='+encodeURIComponent(u),m=document.createElement('div');m.className='modalbg';m.innerHTML=`<div class="modal qr"><h2>Link para NFC e QR</h2><img src="${img}"><p class="small break">${esc(u)}</p><div class="modalfoot"><button class="btn" id="copy">Copiar</button><button class="btn pri" id="close">Fechar</button></div></div>`;document.body.append(m);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(u);toast('Link copiado.')}catch{prompt('Copie:',u)}}}
async function publicPage(sl){app.innerHTML='<div class="auth"><div class="mut">Abrindo…</div></div>';try{let s=await storeBySlug(sl);if(!s){app.innerHTML='<div class="auth"><div class="authbox"><h1>404</h1><p class="mut">Página inexistente ou desativada.</p></div></div>';return}let src=new URLSearchParams(location.search).get('src'),type=src==='nfc'?'nfc_open':src==='qr'?'qr_open':'page_view';track(s.id,type);let c=s.accent_color||'#7c3aed',links=[],add=(l,u,i,t)=>{if(u)links.push({l,u,i,t})},wa=s.whatsapp.replace(/\D/g,'');add('Falar no WhatsApp',wa?'https://wa.me/'+(wa.startsWith('55')?wa:'55'+wa):'', '💬','whatsapp');let ig=s.instagram.trim().replace(/^@/,'');add('Instagram',ig?(ig.startsWith('http')?safe(ig):'https://instagram.com/'+encodeURIComponent(ig)):'','📸','instagram');add('Como chegar',safe(s.maps_url),'📍','maps');add('Ver catálogo / cardápio',safe(s.catalog_url),'📋','catalog');add('Visitar site',safe(s.website_url),'🌐','website');app.innerHTML=`<div class="public"><main class="profile"><div class="ptop"><div class="plogo" style="background:${esc(c)}">${s.logo_url?`<img src="${esc(s.logo_url)}">`:esc(initials(s.name))}</div><h1>${esc(s.name)}</h1><div class="mut small">${esc(s.category)}</div>${s.description?`<p>${esc(s.description)}</p>`:''}</div><div class="links">${links.map(l=>`<a class="plink" target="_blank" rel="noopener" href="${esc(l.u)}" data-track="${l.t}"><span class="pi" style="background:${esc(c)}">${l.i}</span>${esc(l.l)}<span style="margin-left:auto">›</span></a>`).join('')}</div>${s.address||s.hours?`<div class="info">${s.address?`<p><b>📍 Endereço</b><br><span class="mut small">${esc(s.address)}</span></p>`:''}${s.hours?`<p><b>🕒 Horários</b><br><span class="mut small">${esc(s.hours)}</span></p>`:''}</div>`:''}<div class="foot">Página digital por <b>NFC Point</b></div></main></div>`;document.querySelectorAll('[data-track]').forEach(a=>a.onclick=()=>track(s.id,'link_click',a.dataset.track))}catch(e){app.innerHTML=`<div class="auth"><div class="authbox"><h1>Erro</h1><p class="err">${esc(e.message)}</p></div></div>`}}
function route(){let p=path();document.title='NFC Point';if(p==='/')landing();else if(p==='/admin')auth();else if(p.startsWith('/loja/'))publicPage(decodeURIComponent(p.slice(6)));else landing()}route();
</script></body></html>
